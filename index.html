<!doctype html>
<html lang="ru" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Каталог образовательных продуктов — курсы, воркшопы, консультации</title>
    <meta
      name="description"
      content="Витрина современных практических курсов, интенсивных воркшопов и индивидуальных консультаций от экспертов индустрии."
    />
    <meta name="theme-color" content="#0F5C54" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://course-showcase-tau.vercel.app/" />
    <meta property="og:image" content="https://course-showcase-tau.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="ru_RU" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta property="og:title" content="Каталог образовательных продуктов — Ревью.Лаб" />
    <meta
      property="og:description"
      content="Витрина практических программ от Staff и Lead инженеров: архитектура приложений, дизайн-системы и код-ревью."
    />

    <!-- Тема без вспышки: по умолчанию светлая, тёмная только если пользователь выбрал её сам -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('course_showcase_theme');
          document.documentElement.setAttribute('data-theme', saved === 'dark' ? 'dark' : 'light');
        } catch (e) {}
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400..700;1,7..72,400..700&family=Onest:wght@300..700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-surface text-ink font-sans antialiased selection:bg-accent/30 selection:text-ink">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
